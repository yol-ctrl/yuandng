<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>元旦烟花·粒子重组</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<audio id="bgMusic" src="yuand.mp3" loop style="display:none;"></audio>

<!-- 点击提示 -->
<div id="tip" style="position:absolute;top:50%;left:0;width:100%;text-align:center;color:rgba(255,255,255,0.8);font-size:20px;pointer-events:none;transform:translateY(-50%);letter-spacing:2px;">点击屏幕开始</div>

<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w, h, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const bgMusic = document.getElementById('bgMusic');
const tip = document.getElementById('tip');
let started = false;

// 👇 点击屏幕后才开始一切
function startExperience() {
  if (started) return;
  started = true;
  tip.style.display = 'none';

  // 播放音乐
  if (bgMusic.paused) {
    bgMusic.play().catch(() => {});
  }

  // 添加开场烟花，启动动画循环
  fireworks.push(new Firework(w / 2, h * 0.3));
  loop();
}

document.body.addEventListener('click', startExperience);
// 👆 只有点击才触发，按键盘不会触发 👆

const rand = (a, b) => Math.random() * (b - a) + a;
const randColor = () => `hsl(${rand(0,360)},100%,65%)`;

/* ---------- 烟花火花 ---------- */
class Spark {
  constructor(x, y, color, isOuter) {
    this.x = x; this.y = y;
    const angle = rand(0, Math.PI * 2);
    const speed = isOuter ? rand(4, 9) : rand(1, 5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color;
    this.life = 1;
    this.decay = rand(0.006, 0.015);
    this.size = rand(1.5, 3);
    this.gravity = 0.06;
  }
  update() {
    this.vx *= 0.98;
    this.vy = this.vy * 0.98 + this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    let alpha = Math.max(this.life, 0);
    if (this.life < 0.5) alpha *= (Math.random() * 0.5 + 0.3);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------- 烟花弹丸 ---------- */
class Firework {
  constructor(x, targetY) {
    this.x = x;
    this.y = h;
    this.ty = targetY;
    this.vy = rand(-20, -16);
    this.vx = rand(-0.5, 0.5);
    this.color = randColor();
    this.dead = false;
    this.sparks = [];
    this.trail = [];
    this.flashAlpha = 0;
    this.flashRadius = 0;
  }
  update() {
    if (!this.dead) {
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 20) this.trail.shift();
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.15;
      if (this.y <= this.ty || this.vy >= 0) {
        this.explode();
        this.dead = true;
      }
    }
    if (this.flashAlpha > 0) {
      this.flashRadius += 5;
      this.flashAlpha -= 0.03;
    }
    this.sparks.forEach(s => s.update());
    this.sparks = this.sparks.filter(s => s.life > 0);
  }
  explode() {
    for (let i = 0; i < 160; i++) {
      this.sparks.push(new Spark(this.x, this.y, this.color, false));
    }
    for (let i = 0; i < 60; i++) {
      this.sparks.push(new Spark(this.x, this.y, this.color, true));
    }
    this.flashAlpha = 1;
    this.flashRadius = 0;
  }
  draw() {
    if (this.flashAlpha > 0) {
      ctx.globalAlpha = Math.max(this.flashAlpha, 0);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.flashRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (!this.dead && this.trail.length > 1) {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (!this.dead) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    this.sparks.forEach(s => s.draw());
  }
}

let fireworks = [];

/* ---------- 粒子文字 ---------- */
class Dot {
  constructor(x, y) {
    this.x = rand(0, w);
    this.y = rand(0, h);
    this.tx = x;
    this.ty = y;
    this.vx = 0;
    this.vy = 0;
    this.size = 4;
    this.color = '#fff';
  }
  setTarget(x, y) { this.tx = x; this.ty = y; }
  update() {
    const dx = this.tx - this.x, dy = this.ty - this.y;
    this.vx = (this.vx + dx * 0.018) * 0.85;
    this.vy = (this.vy + dy * 0.018) * 0.85;
    this.x += this.vx;
    this.y += this.vy;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

let dots = [];

function sampleText(text) {
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const o = off.getContext('2d');
  o.fillStyle = '#fff';
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  let fs;
  if (text.length <= 2) {
    fs = Math.min(w / 1.9, 240);
  } else {
    fs = Math.min(w * 0.93 / text.length, 200);
  }
  if (fs > h * 0.45) fs = Math.floor(h * 0.45);
  o.font = `bold ${fs}px "PingFang SC","Microsoft YaHei",sans-serif`;
  o.fillText(text, w/2, h/2);
  const data = o.getImageData(0, 0, w, h).data;
  const pts = [];
  const gap = fs > 140 ? 12 : (fs > 110 ? 10 : (fs > 90 ? 9 : 8));
  for (let y = 0; y < h; y += gap) {
    for (let x = 0; x < w; x += gap) {
      if (data[(y * w + x) * 4 + 3] > 128) pts.push({ x, y });
    }
  }
  return pts;
}

function morphTo(text, color) {
  const pts = sampleText(text);
  if (!pts.length) return;
  if (pts.length > dots.length) {
    for (let i = dots.length; i < pts.length; i++) dots.push(new Dot(pts[i].x, pts[i].y));
  } else if (pts.length < dots.length) dots.length = pts.length;
  const shuffled = pts.slice().sort(() => Math.random() - 0.5);
  dots.forEach((d, i) => {
    d.setTarget(shuffled[i].x, shuffled[i].y);
    d.color = color || '#fff';
    d.vx += rand(-12, 12);
    d.vy += rand(-12, 12);
  });
}

/* ---------- 时间轴（45秒）---------- */
const texts = [
  '烟火向星辰','所愿皆成真','接下来的日子','希望你','万事胜意',
  '平安喜乐','最重要的是','祝你考神附体','期末不挂','顺顺利利',
  '天天开心','回家过大年'
];

let frame = 0, textIdx = 0, lastTextFrame = 0;

function loop() {
  requestAnimationFrame(loop);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, 0, w, h);

  frame++;

  if (frame === 150) morphTo('3', '#fff');
  if (frame === 270) morphTo('2', '#ffe28a');
  if (frame === 390) morphTo('1', '#ffb3e6');
  if (frame === 510) {
    morphTo(texts[0], '#ffd6f5');
    lastTextFrame = frame;
    for(let i=0; i<8; i++) setTimeout(() => fireworks.push(new Firework(rand(w*0.1, w*0.9), rand(h*0.2, h*0.35))), i*300);
  }
  if (frame > 510 && frame - lastTextFrame > 180) {
    textIdx++;
    if (textIdx < texts.length) {
      const palette = ['#ffd6f5','#a8e6ff','#fff3a8','#ffc2c2','#c8ffd4','#ffb3e6','#d4a5ff','#a8ffd4'];
      morphTo(texts[textIdx], palette[textIdx % palette.length]);
      lastTextFrame = frame;
    } else if (textIdx === texts.length) {
      lastTextFrame = frame;
    }
  }
  if (textIdx >= texts.length && frame - lastTextFrame > 200) {
    dots.forEach(d => { d.size *= 0.992; d.tx += rand(-0.3,0.3); d.ty += rand(-0.3,0.3); });
  }

  if (frame > 510 && Math.random() < 0.025) {
    fireworks.push(new Firework(rand(w*0.05, w*0.95), rand(h*0.2, h*0.35)));
  }

  ctx.globalCompositeOperation = 'lighter';
  fireworks.forEach(f => { f.update(); f.draw(); });
  fireworks = fireworks.filter(f => !f.dead || f.sparks.length > 0 || f.flashAlpha > 0);

  ctx.globalCompositeOperation = 'source-over';
  dots.forEach(d => { d.update(); d.draw(); });
  dots = dots.filter(d => d.size > 0.1);
}
</script>
</body>
</html>
